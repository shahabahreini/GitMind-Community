name: Publish Wiki

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
    paths:
      - "docs/handbook/**"
      - "docs/reference/**"
      - "wiki/**"
      - "scripts/sync-wiki.mjs"
      - "scripts/validate-docs.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/publish-wiki.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after validation
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-wiki
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run docs:validate
      - name: Validate issue forms and workflow YAML
        run: |
          ruby -e 'require "yaml"; Dir[".github/ISSUE_TEMPLATE/*.{yml,yaml}", ".github/workflows/*.{yml,yaml}"].each { |file| YAML.load_file(file); puts "valid #{file}" }'

  publish:
    name: Publish Wiki
    needs: validate
    if: (github.repository == 'shahabahreini/GitMind-Pro' || github.repository == 'shahabahreini/GitMind-Community' || github.repository == 'shahabahreini/AI-Commit-Assistant' || github.repository == 'shahabahreini/Shahab') && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Check wiki push token
        id: token
        env:
          WIKI_PUSH_TOKEN: ${{ secrets.WIKI_PUSH_TOKEN }}
        run: |
          if [ -z "$WIKI_PUSH_TOKEN" ]; then
            echo "::warning::WIKI_PUSH_TOKEN is not set; skipping Wiki deployment."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Clone initialized Wiki repository
        if: steps.token.outputs.present == 'true'
        env:
          WIKI_PUSH_TOKEN: ${{ secrets.WIKI_PUSH_TOKEN }}
        run: |
          TARGET_REPO="${{ (github.repository == 'shahabahreini/GitMind-Pro' || github.repository == 'shahabahreini/Shahab') && 'shahabahreini/GitMind-Community' || github.repository }}"
          git clone "https://x-access-token:${WIKI_PUSH_TOKEN}@github.com/${TARGET_REPO}.wiki.git" wiki-repository
      - name: Synchronize Wiki source
        if: steps.token.outputs.present == 'true'
        run: rsync -av --delete --exclude=.git/ wiki/ wiki-repository/
      - name: Commit and push changed Wiki content
        if: steps.token.outputs.present == 'true'
        working-directory: wiki-repository
        run: |
          if git diff --quiet && git diff --cached --quiet && test -z "$(git ls-files --others --exclude-standard)"; then
            echo "Wiki is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "docs: publish GitMind Wiki"
          git push
