# Builds the VitePress Handbook in this private repo and publishes it to the `gh-pages`
# branch of the public shahabahreini/GitMind-Community repo, served at
# https://shahabahreini.github.io/GitMind-Community/.
#
# One-time setup:
#   1. Create a fine-grained PAT limited to shahabahreini/GitMind-Community with
#      "Contents: Read and write", and save it here as the COMMUNITY_PAGES_TOKEN secret.
#   2. In GitMind-Community > Settings > Pages, set Source to "Deploy from a branch",
#      branch `gh-pages`, folder `/ (root)`.
name: Publish Documentation Pages

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "wiki/**"
      - "scripts/export-product-surface.mjs"
      - "scripts/sync-wiki.mjs"
      - "scripts/validate-docs.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/publish-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.repository == 'shahabahreini/GitMind-Pro' || github.repository == 'shahabahreini/Shahab'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run docs:validate
      - run: pnpm run docs:build
      - name: Check deploy token
        id: token
        env:
          COMMUNITY_PAGES_TOKEN: ${{ secrets.COMMUNITY_PAGES_TOKEN }}
        run: |
          if [ -z "$COMMUNITY_PAGES_TOKEN" ]; then
            echo "::warning::COMMUNITY_PAGES_TOKEN is not set; skipping Handbook deployment."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to GitMind-Community gh-pages
        if: steps.token.outputs.present == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.COMMUNITY_PAGES_TOKEN }}
          external_repository: shahabahreini/GitMind-Community
          publish_branch: gh-pages
          publish_dir: docs/handbook/.vitepress/dist
          force_orphan: true
          commit_message: "docs: publish Handbook from GitMind-Pro"
