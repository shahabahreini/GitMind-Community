name: Validate Extension

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: validate-extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # vsce package runs vscode:prepublish (the production build) itself.
      - run: pnpm run package:vsce --out /tmp/gitmind-validation.vsix
      - run: pnpm run package:audit
      - run: pnpm run lint:listing
      - run: pnpm run lint:listing --vsix /tmp/gitmind-validation.vsix
