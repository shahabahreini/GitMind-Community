name: Validate Extension

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run package
      - run: pnpm run package:audit
      - run: pnpm run lint:listing
      - run: pnpm run package:vsce --out /tmp/gitmind-validation.vsix
      - run: pnpm run lint:listing --vsix /tmp/gitmind-validation.vsix
