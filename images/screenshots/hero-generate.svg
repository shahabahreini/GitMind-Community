<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>GitMind — Better commits, inside VS Code</title><g font-family="Lato, DejaVu Sans, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#10151c" /><text x="96" y="85" font-size="38" fill="#f3f6fa" font-weight="800" >GitMind</text><rect x="272" y="57" width="1" height="31" rx="0" fill="#394553" /><text x="298" y="82" font-size="18" fill="#a8b5c6" font-weight="700" letter-spacing="2">AI COMMIT MESSAGES FOR VS CODE</text><g opacity="1"><g opacity="1" transform="translate(0 0)"><text x="96" y="206" font-size="78" fill="#f3f6fa" font-weight="800" >From code changes</text><text x="96" y="297" font-size="78" fill="#69b9ed" font-weight="800" >to a commit worth reading.</text></g><g opacity="1" transform="translate(0 0)"><rect x="96" y="371" width="795" height="435" rx="16" fill="#171e27" stroke="#303d4d" stroke-width="2"/><text x="128" y="417" font-size="18" fill="#a8b5c6" font-weight="700" letter-spacing="2">YOUR STAGED DIFF</text><text x="128" y="475" font-size="28" fill="#f3f6fa" font-weight="700" >checkout.js</text><text x="128" y="549" font-size="25" fill="#a8b5c6" font-weight="400" font-family="DejaVu Sans Mono, monospace">for (const item of cart) {</text><rect x="112" y="570" width="763" height="48" rx="5" fill="#3d242a" /><text x="128" y="603" font-size="25" fill="#edafb4" font-weight="400" font-family="DejaVu Sans Mono, monospace">− total += item.price;</text><rect x="112" y="628" width="763" height="48" rx="5" fill="#20382e" /><text x="128" y="661" font-size="25" fill="#90d8b5" font-weight="400" font-family="DejaVu Sans Mono, monospace">+ total += item.price * item.quantity;</text><text x="128" y="719" font-size="25" fill="#a8b5c6" font-weight="400" font-family="DejaVu Sans Mono, monospace">}</text><text x="128" y="772" font-size="22" fill="#a8b5c6" font-weight="400" >The change is the context.</text></g><path d="M911 587H1009" stroke="#303d4d" stroke-width="3"/><path d="M911 587H1009" stroke="#69b9ed" stroke-width="3" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0"/><path d="M997 576l12 11-12 11" fill="none" stroke="#69b9ed" stroke-width="3" opacity="1"/><rect x="1029" y="371" width="795" height="435" rx="16" fill="#171e27" stroke="#303d4d" stroke-width="2"/><text x="1061" y="417" font-size="18" fill="#a8b5c6" font-weight="700" letter-spacing="2">YOUR COMMIT MESSAGE</text><g opacity="0"><text x="1061" y="552" font-size="36" fill="#a8b5c6" font-weight="400" >Give the next developer</text><text x="1061" y="601" font-size="36" fill="#a8b5c6" font-weight="400" >a useful starting point.</text></g><g opacity="1" transform="translate(0 0)"><text x="1061" y="516" font-size="35" fill="#69b9ed" font-weight="700" >fix(checkout):</text><text x="1061" y="567" font-size="35" fill="#f3f6fa" font-weight="700" >account for item quantities</text></g><g opacity="1" transform="translate(0 0)"><text x="1061" y="636" font-size="26" fill="#a8b5c6" font-weight="400" >Multiply each price by its quantity</text><text x="1061" y="674" font-size="26" fill="#a8b5c6" font-weight="400" >when calculating the order total.</text></g><g opacity="1" transform="translate(0 0)"><rect x="1061" y="726" width="257" height="47" rx="23" fill="#203141" /><text x="1189.5" y="757" font-size="20" fill="#69b9ed" font-weight="700" text-anchor="middle">Conventional Commit</text></g><g opacity="1" transform="translate(0 0)"><text x="96" y="903" font-size="31" fill="#f3f6fa" font-weight="700" >Stage your changes.</text><text x="655" y="903" font-size="31" fill="#f3f6fa" font-weight="700" >Generate with GitMind.</text><text x="1264" y="903" font-size="31" fill="#f3f6fa" font-weight="700" >Review. Refine. Commit.</text></g><text x="1824" y="959" font-size="17" fill="#a8b5c6" font-weight="400" text-anchor="end">Illustrative code and message</text></g><path d="M96 997H1824" stroke="#303d4d"/><text x="96" y="1038" font-size="21" fill="#a8b5c6" font-weight="400" >Built for your Git workflow.</text><text x="1824" y="1038" font-size="21" fill="#a8b5c6" font-weight="400" text-anchor="end">gitmind-pro.com</text></g></svg>